<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rechnungsgenerator · Surhay Yilmaz</title>
  <meta name="description" content="Rechnungen im Browser erstellen: Live-Vorschau, Umsatzsteuer 19 %/7 %, Kleinunternehmerregelung und PDF-Export.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <span class="logo" aria-hidden="true">🧾</span>
      <div>
        <h1>Rechnungsgenerator</h1>
        <p class="subtitle">Live-Vorschau · USt 19 % / 7 % · § 19 UStG · PDF-Export</p>
      </div>
    </div>
    <div class="actions">
      <button id="sample-btn" class="btn ghost" type="button">Beispiel laden</button>
      <button id="new-btn" class="btn" type="button">Neue Rechnung</button>
      <button id="print-btn" class="btn primary" type="button">⬇ Als PDF speichern</button>
    </div>
  </header>

  <main class="layout">
    <form id="invoice-form" class="editor no-print" novalidate autocomplete="off">
      <fieldset>
        <legend>Rechnungssteller</legend>
        <label>Name / Firma <input data-field="sender.name"></label>
        <label>Anschrift <textarea data-field="sender.address" rows="2"></textarea></label>
        <div class="grid-2">
          <label>Steuernr. / USt-IdNr. <input data-field="sender.taxId"></label>
          <label>E-Mail <input data-field="sender.email" type="email"></label>
          <label>IBAN <input data-field="sender.iban" spellcheck="false"></label>
          <label>Bank <input data-field="sender.bank"></label>
        </div>
        <label class="check"><input type="checkbox" data-field="kleinunternehmer"> Kleinunternehmer (§ 19 UStG – keine Umsatzsteuer)</label>
      </fieldset>

      <fieldset>
        <legend>Empfänger</legend>
        <label>Name / Firma <input data-field="recipient.name"></label>
        <label>Anschrift <textarea data-field="recipient.address" rows="2"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>Rechnungsdaten</legend>
        <div class="grid-2">
          <label>Rechnungsnummer <input data-field="number"></label>
          <label>Rechnungsdatum <input data-field="date" type="date"></label>
          <label>Leistungsdatum / -zeitraum <input data-field="serviceDate" placeholder="z. B. November 2026"></label>
          <label>Zahlungsziel (Tage) <input data-field="paymentDays" type="number" min="0" max="120"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Positionen</legend>
        <div class="items-head" aria-hidden="true">
          <span>Beschreibung</span><span>Menge</span><span>Einheit</span><span>Einzelpreis €</span><span>USt</span><span></span>
        </div>
        <div id="items"></div>
        <button id="add-item-btn" class="btn" type="button">+ Position hinzufügen</button>
      </fieldset>

      <fieldset>
        <legend>Hinweis</legend>
        <textarea data-field="note" rows="2" placeholder="z. B. Vielen Dank für Ihren Auftrag!"></textarea>
      </fieldset>

      <ul id="errors" class="errors" aria-live="polite"></ul>
    </form>

    <section class="preview-wrap" aria-label="Vorschau">
      <article id="preview" class="paper"></article>
    </section>
  </main>

  <footer class="footer no-print">
    Gebaut von <a href="https://github.com/Surhay276">Surhay Yilmaz</a> ·
    <a href="https://github.com/Surhay276/rechnungs-generator">Quellcode auf GitHub</a> ·
    Alle Daten bleiben lokal im Browser.
  </footer>

  <template id="item-template">
    <div class="item-row">
      <input data-key="description" aria-label="Beschreibung" placeholder="Leistung">
      <input data-key="quantity" aria-label="Menge" inputmode="decimal">
      <input data-key="unit" aria-label="Einheit" placeholder="Std.">
      <input data-key="unitPrice" aria-label="Einzelpreis netto" inputmode="decimal">
      <select data-key="taxRate" aria-label="Umsatzsteuersatz">
        <option value="19">19 %</option>
        <option value="7">7 %</option>
        <option value="0">0 %</option>
      </select>
      <button type="button" class="icon-btn" data-action="remove" aria-label="Position entfernen" title="Entfernen">✕</button>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
